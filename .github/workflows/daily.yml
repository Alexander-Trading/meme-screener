name: Taeglicher Meme-Screener

on:
  schedule:
    - cron: "43 6 * * *"    # Hauptlauf: Depot + Telegram (ca. 07:43 / 08:43 Uhr deutscher Zeit)
    - cron: "43 0,12,18 * * *"  # zusätzliche Sammelläufe für mehr Daten
  workflow_dispatch: {}     # manuell starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Screener ausfuehren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python screener.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet && exit 0
          git commit -m "Lauf $(date -u +%F_%H)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Auswertung als CSV bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyse-csv
          path: out/analyse.csv
          if-no-files-found: ignore
          retention-days: 30
